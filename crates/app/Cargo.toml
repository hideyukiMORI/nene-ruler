[package]
name = "nene-ruler"
description = "A tiny transparent screen ruler for X11 and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# 配布は GitHub Release のバイナリ。crates.io には出さない。
publish = false

[[bin]]
name = "nene-ruler"
path = "src/main.rs"

[lints]
workspace = true

# 🔴 合成ルートだけが全クレートを見る（ARC-002 / ARC-006）。外部 crate はここに書かない。
#    OS ごとのアダプタと画面は target の節で選ぶ（ADR 0021）。
[dependencies]
nene-ruler-settings-file = { path = "../settings-file" }
nene-ruler-application = { path = "../application" }
nene-ruler-core = { path = "../core" }

[target.'cfg(not(windows))'.dependencies]
nene-ruler-adapters-x11 = { path = "../adapters-x11" }
nene-ruler-ui-x11 = { path = "../ui-x11" }

# exe に埋めるアイコンの絵（ADR 0023）。build.rs だけが使う。
[build-dependencies]
nene-ruler-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
nene-ruler-adapters-windows = { path = "../adapters-windows" }
nene-ruler-ui-win32 = { path = "../ui-win32" }
