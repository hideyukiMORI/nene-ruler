[package]
name = "nene-ruler"
description = "A tiny transparent screen ruler for X11"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# 配布は GitHub Release のバイナリ。crates.io には出さない。
publish = false

[[bin]]
name = "nene-ruler"
path = "src/main.rs"

[lints]
workspace = true

# 🔴 合成ルートだけが全クレートを見る（ARC-002 / ARC-006）。外部 crate はここに書かない。
[dependencies]
nene-ruler-adapters-x11 = { path = "../adapters-x11" }
nene-ruler-ui-x11 = { path = "../ui-x11" }
nene-ruler-application = { path = "../application" }
nene-ruler-core = { path = "../core" }
