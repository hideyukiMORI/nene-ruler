# cargo-deny — 依存の許可制を機械が見る（ARC-013 / ADR 0002）。
#
# 🔴 検査の入口は `make deny`（`make check` に含まれる）。CI 側にだけ検査を書かない（QLT-005）。
# 🔴 ここを緩める変更は ADR を要する（QLT-010）。
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# 🔴 実際に使っているライセンスだけを書く。`make deny` は `--deny license-not-encountered` を
#    付けて走るので、使っていないライセンスをここに書くと落ちる。
#    現在の実測: MIT — nene-ruler / xtask（依存 0）。
allow = ["MIT"]
confidence-threshold = 0.8

[bans]
# 同じクレートの複数版を許さない。単一バイナリで配る前提に対して、重複は「どちらが効いているか分からない」を持ち込む。
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
